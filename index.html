<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<title>Partizip II Trainer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one exercise sheet on squared school paper (Kästchenpapier); ink-blue writing, red correction pen, mastery grid underneath. */
:root {
  --paper: #f6f8fb;
  --grid: #dde5f0;
  --sheet: #ffffff;
  --ink: #1b2a4a;
  --muted: #5d6b86;
  --blue: #2346b8;
  --blue-soft: #e4eafb;
  --red: #c42a2a;
  --red-soft: #fbe6e4;
  --green: #1d7a4a;
  --green-soft: #e1f3e8;
  --line: #cfd8e6;
  --l0: #e9edf4; --l1: #cdd9f5; --l2: #9fb5ec; --l3: #5f82dc; --l4: #2346b8;
  --l-fg-dark: #ffffff;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121a2b; --grid: #1b2640; --sheet: #18223a; --ink: #e6ebf5; --muted: #98a5c0;
    --blue: #8ea8ff; --blue-soft: #243358; --red: #ff8a80; --red-soft: #3d2228;
    --green: #6fd39b; --green-soft: #1d3a2d; --line: #2c3a5a;
    --l0: #222d47; --l1: #2c3f73; --l2: #3d58a3; --l3: #5f7fd6; --l4: #8ea8ff; --l-fg-dark: #0f1626;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121a2b; --grid: #1b2640; --sheet: #18223a; --ink: #e6ebf5; --muted: #98a5c0;
  --blue: #8ea8ff; --blue-soft: #243358; --red: #ff8a80; --red-soft: #3d2228;
  --green: #6fd39b; --green-soft: #1d3a2d; --line: #2c3a5a;
  --l0: #222d47; --l1: #2c3f73; --l2: #3d58a3; --l3: #5f7fd6; --l4: #8ea8ff; --l-fg-dark: #0f1626;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
}
.wrap {
  max-width: 720px;
  margin: 0 auto;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 20px;
}
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
h1 {
  font-family: var(--display); font-weight: 800; font-size: clamp(28px, 6vw, 40px);
  line-height: 1; margin: 0; letter-spacing: -0.02em; text-wrap: balance;
}
h1 span { color: var(--blue); }
.sub { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.stats { display: flex; gap: 16px; font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 600; }

.listbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.listbar label { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
#lang-select { flex: 0 1 180px; }
#list-select, #lang-select {
  flex: 1 1 220px; min-width: 0; font: 700 15px var(--body); color: var(--ink);
  background: var(--sheet); border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px;
}
.sync { font-size: 13px; color: var(--muted); flex-basis: 100%; }
.sync:empty { display: none; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.verb.verb-tr { font-size: clamp(22px, 5vw, 32px); line-height: 1.25; }
.tab {
  font: 700 15px var(--body); color: var(--ink); background: var(--sheet);
  border: 1.5px solid var(--line); border-radius: 999px; padding: 8px 16px; cursor: pointer;
}
.tab:hover { border-color: var(--blue); }
.tab[aria-selected="true"] { background: var(--blue); border-color: var(--blue); color: var(--sheet); }
.tab:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, summary:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

.sheet {
  background: var(--sheet); border: 1.5px solid var(--line); border-radius: 14px;
  padding: 28px clamp(18px, 5vw, 40px) 24px; display: grid; gap: 18px; min-height: 340px;
  position: relative;
}
.prompt-label { font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.verb { font-family: var(--display); font-weight: 700; font-size: clamp(40px, 11vw, 64px); line-height: 1; letter-spacing: -0.02em; margin: 4px 0 0; overflow-wrap: anywhere; }
.trans { color: var(--muted); font-size: 17px; margin-top: 6px; }
.extra { font-family: var(--mono); font-size: 13px; color: var(--muted); }

.answer-row { display: flex; gap: 8px; flex-wrap: wrap; }
#answer {
  flex: 1 1 240px; min-width: 0; font: 600 22px var(--mono); color: var(--blue);
  background: var(--paper); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px;
}
#answer::placeholder { color: var(--muted); opacity: .6; font-weight: 400; }
.btn {
  font: 700 16px var(--body); border-radius: 10px; padding: 12px 18px; cursor: pointer;
  border: 1.5px solid var(--blue); background: var(--blue); color: var(--sheet);
}
.btn.ghost { background: transparent; color: var(--blue); }
.btn.small { font-size: 14px; padding: 8px 12px; }
.btn:disabled { opacity: .5; cursor: default; }

.choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.aux-choices { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.choice {
  font: 600 19px var(--mono); color: var(--ink); text-align: left;
  background: var(--paper); border: 1.5px solid var(--line); border-radius: 10px;
  padding: 14px 14px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; min-width: 0;
  overflow-wrap: anywhere;
}
.choice .k { font-size: 12px; color: var(--muted); font-weight: 400; flex: none; }
.choice:hover:not(:disabled) { border-color: var(--blue); }
.choice:disabled { cursor: default; }
.choice.right { background: var(--green-soft); border-color: var(--green); color: var(--green); }
.choice.wrong { background: var(--red-soft); border-color: var(--red); color: var(--red); text-decoration: line-through; text-decoration-thickness: 2px; }
.aux-choices .choice { justify-content: center; font-size: 26px; padding: 22px 14px; font-family: var(--display); font-weight: 700; }

.feedback { min-height: 56px; border-radius: 10px; padding: 12px 14px; font-size: 16px; display: grid; gap: 2px; }
.feedback:empty { background: transparent; padding: 0; }
.feedback.ok { background: var(--green-soft); color: var(--green); }
.feedback.bad { background: var(--red-soft); color: var(--red); }
.feedback .sol { font: 600 20px var(--mono); color: var(--ink); }
.feedback .sol .hit { color: var(--red); text-decoration: underline wavy; text-underline-offset: 4px; }
.hint { font-size: 13px; color: var(--muted); }
.hint kbd { font-family: var(--mono); font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--paper); }

/* List editor */
.editor { align-content: start; }
.field { display: grid; gap: 6px; font-size: 14px; color: var(--muted); }
.field code { font-family: var(--mono); font-size: 13px; color: var(--ink); background: var(--blue-soft); padding: 1px 5px; border-radius: 4px; }
#ed-name, #ed-text {
  font: 400 16px var(--body); color: var(--ink); background: var(--paper);
  border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0;
}
#ed-name { font-weight: 700; }
#ed-text { font-family: var(--mono); font-size: 15px; line-height: 1.6; resize: vertical; min-height: 220px; }
.ed-check { font-size: 14px; display: grid; gap: 4px; }
.ed-check .ok { color: var(--green); }
.ed-check .err { color: var(--red); font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
.ed-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ed-actions .spacer { flex: 1; }

.empty { color: var(--muted); align-self: center; text-align: center; }

section h2 { font-family: var(--display); font-weight: 700; font-size: 20px; margin: 0 0 4px; }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.legend i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
.mastery { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
.chip {
  font: 400 13px var(--mono); padding: 6px 8px; border-radius: 6px; background: var(--l0); color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; justify-content: space-between; gap: 4px;
}
.chip[data-lvl="1"] { background: var(--l1); }
.chip[data-lvl="2"] { background: var(--l2); }
.chip[data-lvl="3"] { background: var(--l3); color: var(--l-fg-dark); }
.chip[data-lvl="4"] { background: var(--l4); color: var(--l-fg-dark); }
.chip .aux { opacity: .65; }
.reset { margin-top: 10px; font: 400 13px var(--body); background: none; border: none; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 0; }
.confirm { font-size: 13px; color: var(--muted); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }

details { background: var(--sheet); border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 18px; }
summary { cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 18px; }
.table-wrap { overflow-x: auto; margin-top: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 400; }
td.pp { font-family: var(--mono); color: var(--blue); }
td.pp .ist { font-weight: 700; }

/* German text stays left-to-right inside right-to-left interfaces */
.verb, #answer, .choice, .sol, .chip, td.pp, #list td:first-child, #ed-text, .extra { direction: ltr; unicode-bidi: isolate; }
[dir="rtl"] .verb { text-align: right; }
[dir="rtl"] .verb.verb-tr { direction: rtl; }

@keyframes pop { from { transform: translateY(4px); opacity: .4; } to { transform: none; opacity: 1; } }
.fresh { animation: pop .18s ease-out; }
@media (prefers-reduced-motion: reduce) { .fresh { animation: none; } }
@media (max-width: 460px) {
  .choices:not(.aux-choices) { grid-template-columns: 1fr; }
  .stats { gap: 12px; }
}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Partizip <span>II</span> Trainer</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="stats" aria-live="polite">
      <span><span data-i18n="correct"></span> <b id="st-ok">0</b>/<b id="st-all">0</b></span>
      <span><span data-i18n="streak"></span> <b id="st-streak">0</b></span>
      <span><span data-i18n="best"></span> <b id="st-best">0</b></span>
    </div>
  </header>

  <div class="listbar">
    <label for="lang-select" data-i18n="language"></label>
    <select id="lang-select"></select>
    <label for="list-select" data-i18n="list"></label>
    <select id="list-select"></select>
    <button class="btn ghost small" id="list-edit" type="button" data-i18n="edit"></button>
    <button class="btn ghost small" id="list-new" type="button" data-i18n="newList"></button>
    <div class="sync" id="sync"></div>
  </div>

  <section class="sheet editor" id="editor" hidden aria-labelledby="ed-title">
    <div class="prompt-label" id="ed-title"></div>
    <label class="field">
      <span data-i18n="name"></span>
      <input id="ed-name" type="text" maxlength="60" autocomplete="off">
    </label>
    <label class="field">
      <span id="ed-format"></span>
      <textarea id="ed-text" rows="10" spellcheck="false" placeholder="trinken; hat getrunken; …&#10;fahren; ist gefahren; …&#10;mitkommen; ist mitgekommen; …"></textarea>
    </label>
    <div class="ed-check" id="ed-check" aria-live="polite"></div>
    <div class="ed-actions">
      <button class="btn" id="ed-save" type="button" data-i18n="save"></button>
      <button class="btn ghost" id="ed-cancel" type="button" data-i18n="cancel"></button>
      <button class="btn ghost small" id="ed-copy" type="button" data-i18n="insertBase"></button>
      <span class="spacer"></span>
      <span id="ed-del-area"></span>
    </div>
  </section>

  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" id="tab-type" data-mode="type" data-i18n="modeType"></button>
    <button class="tab" role="tab" id="tab-aux" data-mode="aux" data-i18n="modeAux"></button>
    <button class="tab" role="tab" id="tab-mc" data-mode="mc" data-i18n="modeMc"></button>
    <button class="tab" role="tab" id="tab-mean" data-mode="mean" data-i18n="modeMeaning"></button>
    <button class="tab" role="tab" id="tab-trans" data-mode="trans" data-i18n="modeTrans"></button>
  </nav>

  <main class="sheet" id="sheet" aria-live="polite"></main>

  <section>
    <h2 data-i18n="progress"></h2>
    <div class="legend">
      <span data-i18n="new"></span> <i style="background:var(--l0)"></i><i style="background:var(--l1)"></i><i style="background:var(--l2)"></i><i style="background:var(--l3)"></i><i style="background:var(--l4)"></i> <span data-i18n="sure"></span>
      <span data-i18n="legendNote"></span>
    </div>
    <div class="mastery" id="mastery"></div>
    <div id="reset-area"></div>
  </section>

  <details>
    <summary data-i18n="wordList"></summary>
    <div class="table-wrap">
      <table>
        <thead><tr><th data-i18n="thInf"></th><th>Perfekt</th><th data-i18n="thTr"></th></tr></thead>
        <tbody id="list"></tbody>
      </table>
    </div>
  </details>
</div>

const HTML_VARS = { hat: "<i>hat</i>", ist: "<i>ist</i>", enter: "<kbd>Enter</kbd>", H: "<kbd>H</kbd>", I: "<kbd>I</kbd>", bar: "<code>|</code>" };
const PLAIN_VARS = { hat: "hat", ist: "ist", enter: "Enter", H: "H", I: "I", bar: "|" };

// Look up interface text in the chosen language. html: escape the text and fill placeholders with markup
// (caller passes already-escaped vars); plain: for textContent, placeholders and <option>s.
function L(key, vars = {}, html = true) {
  const i = KEYS.indexOf(key);
  const s = (UI[state.lang] || UI.en)[i] ?? UI.en[i];
  const fill = (_, k) => vars[k] ?? (html ? HTML_VARS : PLAIN_VARS)[k] ?? `{${k}}`;
  return (html ? esc(s) : s).replace(/\{(\w+)\}/g, fill);
}

function makeVerb(inf, aux, pp, tr, fakes, extra) {
  return { inf, aux, pp, tr: tr || "", fakes: fakes || fakesFor(pp), extra, full: aux + " " + pp };
}

// Plausible wrong participles for custom verbs: weak/strong ending swap, stem vowel swap, ge- prefix toggle.
function fakesFor(pp) {
  const out = new Set();
  if (/en$/.test(pp)) out.add(pp.replace(/en$/, "t"));
  else if (/t$/.test(pp)) out.add(pp.replace(/t$/, "en"));
  const start = pp.startsWith("ge") ? 2 : 0;
  for (const [a, b] of [["ie", "ei"], ["o", "a"], ["u", "a"], ["a", "u"], ["e", "i"], ["i", "a"]]) {
    const i = pp.indexOf(a, start);
    if (i >= 0 && i < pp.length - 2) { out.add(pp.slice(0, i) + b + pp.slice(i + a.length)); break; }
  }
  out.add(pp.startsWith("ge") ? pp.slice(2) : "ge" + pp);
  out.delete(pp);
  return [...out].filter(Boolean);
}

// One verb per line: "Infinitiv; hat/ist Partizip; Übersetzung". Separators ; | or tab. Blank lines and # comments are skipped.
function parseList(text) {
  const verbs = [], errors = [], seen = new Set();
  String(text || "").split(/\r?\n/).forEach((raw, i) => {
    const line = raw.trim();
    if (!line || line.startsWith("#")) return;
    const parts = line.split(/\s*(?:;|\||\t)\s*/);
    const inf = parts[0];
    const m = (parts[1] || "").match(/^(hat|ist)\s+(\S.*)$/i);
    if (!inf || !m) { errors.push({ key: "lineErr", n: i + 1, line }); return; }
    if (seen.has(inf.toLowerCase())) { errors.push({ key: "dupErr", n: i + 1, inf }); return; }
    seen.add(inf.toLowerCase());
    verbs.push(makeVerb(inf, m[1].toLowerCase(), m[2].trim(), parts.slice(2).join("; ")));
  });
  return { verbs, errors };
}

const BASE_LIST = { id: "base", get name() { return L("baseName", {}, false); }, verbs: BASE_VERBS };
const PREFIX_LIST = { id: "prefix", get name() { return L("prefixName", {}, false); }, verbs: PREFIX_VERBS };
const BUILTIN_LISTS = [BASE_LIST, PREFIX_LIST];
const isBuiltin = id => BUILTIN_LISTS.some(l => l.id === id);
const baseText = () => BASE_VERBS.map(v => `${v.inf}; ${v.full}${trOf(v) ? "; " + trOf(v) : ""}`).join("\n");

/* ---------- Per-browser settings and progress ---------- */
const MAX_LVL = 4;
const STORE_KEY = "partizip-trainer-v1";
const CACHE_KEY = "partizip-lists-cache";   // last copy of the saved lists, for the first frame
const LOCAL_KEY = "partizip-lists-local";   // lists when no shared store is available (e.g. the local file)
let state = { lvl: {}, best: 0, mode: "type", list: "base" };
try { const s = JSON.parse(localStorage.getItem(STORE_KEY)); if (s && s.lvl) state = { ...state, ...s }; } catch (e) {}
const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} };
const readLS = k => { try { return JSON.parse(localStorage.getItem(k)) || null; } catch (e) { return null; } };
const writeLS = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

// Language: saved choice, else the browser's language, else English. ("none" came from an older version.)
if (!state.lang || state.lang === "none") {
  const codes = LANGS.map(l => l[0]);
  state.lang = (navigator.languages || [navigator.language || ""]).map(l => l.slice(0, 2).toLowerCase())
    .map(l => l === "fil" ? "tl" : l).find(l => codes.includes(l)) || "en";
}
// Built-in verbs carry every language (none for German); custom-list verbs have their own single translation.
const trOf = v => v.trs ? v.trs[state.lang] || "" : v.tr;

// Progress is kept per list; the built-in list keeps its old keys.
const isTrMode = m => m === "mean" || m === "trans";
const listKey = v => (state.list === "base" ? "" : state.list + ":") + v.inf;
// Knowing a verb's meaning and knowing its Perfekt are separate skills, so the translation modes keep their own level.
const lvlKey = v => (isTrMode(state.mode) ? "tr:" : "") + listKey(v);
const lvlOf = v => state.lvl[lvlKey(v)] || 0;

/* ---------- Word lists ---------- */
let customLists = readLS(CACHE_KEY) || [];   // [{id, name, text}]
let listsSettled = false;                    // true once the store (or local storage) has answered
let storage = "pending";                     // "pending" | "db" | "local"

const allLists = () => [...BUILTIN_LISTS, ...customLists.map(l => ({ ...l, verbs: parseList(l.text).verbs }))];
const activeList = () => allLists().find(l => l.id === state.list) || BASE_LIST;
let VERBS = activeList().verbs;
let activeSig = "";

const dbP = (async () => {
  try { return window.claude?.use ? await window.claude.use("db") : null; } catch (e) { return null; }
})();

dbP.then(db => {
  if (!db) {
    storage = "local";
    customLists = readLS(LOCAL_KEY) || [];
    listsSettled = true;
    setSync("syncLocal");
    refreshLists();
    return;
  }
  storage = "db";
  const slow = setTimeout(() => setSync("syncSlow"), 10000);
  db.collection("lists").onSnapshot(snap => {
    customLists = snap.docs.map(d => ({ id: d.id, name: String(d.data().name || "Ohne Namen"), text: String(d.data().text || "") }))
      .sort((a, b) => a.name.localeCompare(b.name, "de"));
    if (!snap.metadata.fromCache) { listsSettled = true; clearTimeout(slow); setSync(""); }
    writeLS(CACHE_KEY, customLists);
    refreshLists();
  }, () => {
    clearTimeout(slow); listsSettled = true;
    setSync("syncFail");
    refreshLists();
  });
});

let syncKey = "";
function setSync(key) { syncKey = key; $("sync").textContent = key ? L(key, {}, false) : ""; }

// Rebuild the picker; restart the game only if the active list itself changed.
function refreshLists() {
  if (listsSettled && !isBuiltin(state.list) && !customLists.some(l => l.id === state.list)) { state.list = "base"; save(); }
  const lists = allLists();
  $("list-select").innerHTML = lists.map(l =>
    `<option value="${esc(l.id)}"${l.id === state.list ? " selected" : ""}>${esc(l.name)} (${l.verbs.length})</option>`).join("");
  $("list-edit").disabled = isBuiltin(state.list);
  const al = activeList();
  const sig = al.id + "\n" + (al.text ?? "");
  if (sig !== activeSig) {
    activeSig = sig; VERBS = al.verbs; last = null;
    $("sub").innerHTML = L("sub", { n: VERBS.length });
    renderList(); renderMastery(); renderReset();
    if ($("editor").hidden) next();
  }
}

$("list-select").addEventListener("change", e => { state.list = e.target.value; save(); refreshLists(); });

/* ---------- List editor ---------- */
let editingId = null;
function openEditor(list) {
  editingId = list ? list.id : null;
  $("ed-title").textContent = L(list ? "edEdit" : "edNew", {}, false);
  $("ed-name").value = list ? list.name : "";
  $("ed-text").value = list ? list.text : "";
  $("ed-del-area").innerHTML = list ? `<button class="reset" id="ed-del" type="button" style="margin:0">${L("delList")}</button>` : "";
  if (list) $("ed-del").addEventListener("click", askDelete);
  $("editor").hidden = false; $("sheet").hidden = true; $("tabs").hidden = true;
  clearTimeout(timer); locked = true;
  checkEditor();
  (list ? $("ed-text") : $("ed-name")).focus();
}
function closeEditor() {
  $("editor").hidden = true; $("sheet").hidden = false; $("tabs").hidden = false;
  editingId = null; next();
}
function checkEditor() {
  const { verbs, errors } = parseList($("ed-text").value);
  const ist = verbs.filter(v => v.aux === "ist").length;
  $("ed-check").innerHTML =
    (verbs.length ? `<span class="ok">${L("found", { n: verbs.length, h: verbs.length - ist, i: ist })}</span>` : `<span>${L("noneFound")}</span>`) +
    errors.slice(0, 6).map(e => `<span class="err">${L(e.key, { n: e.n, line: esc(e.line || ""), inf: esc(e.inf || ""), ex: "trinken; hat getrunken" })}</span>`).join("") +
    (errors.length > 6 ? `<span class="err">${L("more", { n: errors.length - 6 })}</span>` : "");
  $("ed-save").disabled = !verbs.length;
  return { verbs, errors };
}
$("ed-text").addEventListener("input", checkEditor);
$("list-new").addEventListener("click", () => openEditor(null));
$("list-edit").addEventListener("click", () => { const l = customLists.find(x => x.id === state.list); if (l) openEditor(l); });
$("ed-cancel").addEventListener("click", closeEditor);
$("ed-copy").addEventListener("click", () => {
  const t = $("ed-text");
  t.value = (t.value.trim() ? t.value.trimEnd() + "\n" : "") + baseText();
  checkEditor(); t.focus();
});

$("ed-save").addEventListener("click", async () => {
  const { verbs } = checkEditor();
  if (!verbs.length) return;
  const name = $("ed-name").value.trim() || L("myList", {}, false);
  const text = $("ed-text").value;
  const btn = $("ed-save"); btn.disabled = true; btn.textContent = L("saving", {}, false);
  try {
    const db = await dbP;
    let id = editingId;
    if (db) {
      const ref = id ? db.collection("lists").doc(id) : db.collection("lists").doc();
      await ref.set({ name, text, updated: Date.now() });
      id = ref.id;
    } else {
      id = id || "l" + Date.now().toString(36);
    }
    customLists = [...customLists.filter(l => l.id !== id), { id, name, text }].sort((a, b) => a.name.localeCompare(b.name, "de"));
    writeLS(storage === "db" ? CACHE_KEY : LOCAL_KEY, customLists);
    state.list = id; save();
    $("editor").hidden = true; $("sheet").hidden = false; $("tabs").hidden = false; editingId = null;
    activeSig = ""; refreshLists();
  } catch (e) {
    $("ed-check").insertAdjacentHTML("beforeend",
      `<span class="err">${L("saveFail")}</span>`);
  } finally {
    btn.textContent = L("save", {}, false); btn.disabled = false;
  }
});

function askDelete() {
  $("ed-del-area").innerHTML = `<span class="confirm" style="margin:0">${L("delSure")}
    <button class="btn ghost small" id="ed-del-yes" type="button">${L("delYes")}</button>
    <button class="reset" id="ed-del-no" type="button" style="margin:0">${L("cancel")}</button></span>`;
  $("ed-del-no").addEventListener("click", () => {
    $("ed-del-area").innerHTML = `<button class="reset" id="ed-del" type="button" style="margin:0">${L("delList")}</button>`;
    $("ed-del").addEventListener("click", askDelete);
  });
  $("ed-del-yes").addEventListener("click", async () => {
    const id = editingId;
    try {
      const db = await dbP;
      if (db) await db.collection("lists").doc(id).delete();
      customLists = customLists.filter(l => l.id !== id);
      writeLS(storage === "db" ? CACHE_KEY : LOCAL_KEY, customLists);
      for (const k of Object.keys(state.lvl)) if (k.startsWith(id + ":")) delete state.lvl[k];
      state.list = "base"; save();
      $("editor").hidden = true; $("sheet").hidden = false; $("tabs").hidden = false; editingId = null;
      activeSig = ""; refreshLists();
    } catch (e) {
      $("ed-check").insertAdjacentHTML("beforeend", `<span class="err">${L("delFail")}</span>`);
    }
  });
}

/* ---------- Game ---------- */
let session = { ok: 0, all: 0, streak: 0 };
let current = null, last = null, locked = false, timer = null;

// Weighted pick: weak verbs (low level) come up far more often. In hat/ist mode, boost "ist" verbs to ~40% when the list has both.
function pick(mode) {
  const source = isTrMode(mode) ? VERBS.filter(v => trOf(v)) : VERBS;
  let pool = source.filter(v => v !== last);
  if (!pool.length) pool = source;
  let weights = pool.map(v => 2 ** (MAX_LVL - lvlOf(v)));
  if (mode === "aux") {
    const istTotal = pool.reduce((s, v, i) => s + (v.aux === "ist" ? weights[i] : 0), 0);
    const hatTotal = pool.reduce((s, v, i) => s + (v.aux === "hat" ? weights[i] : 0), 0);
    if (istTotal && hatTotal) weights = pool.map((v, i) => v.aux === "ist" ? weights[i] / istTotal * 0.4 : weights[i] / hatTotal * 0.6);
  }
  let r = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < pool.length; i++) { r -= weights[i]; if (r <= 0) return pool[i]; }
  return pool[pool.length - 1];
}

function record(v, correct) {
  session.all++;
  if (correct) {
    session.ok++; session.streak++;
    state.lvl[lvlKey(v)] = Math.min(MAX_LVL, lvlOf(v) + 1);
    state.best = Math.max(state.best, session.streak);
  } else {
    session.streak = 0;
    state.lvl[lvlKey(v)] = 0;
  }
  save(); renderStats(); renderMastery();
}

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
const norm = s => s.toLowerCase().replace(/ß/g, "ss").replace(/\s+/g, " ").trim();

function header(v, label) {
  return `<div><div class="prompt-label">${label}</div>
    <div class="verb fresh">${esc(v.inf)}</div>
    <div class="trans" dir="auto"${trOf(v) ? "" : " hidden"}>${esc(trOf(v))}</div>
    ${v.extra ? `<div class="extra">${esc(v.extra)}</div>` : ""}</div>`;
}

const RENDER = { type: renderType, aux: renderAux, mc: renderMc, mean: renderMean, trans: renderTrans };

function next() {
  clearTimeout(timer); locked = false;
  if (!VERBS.length) { $("sheet").innerHTML = `<p class="empty">${L("empty")}</p>`; return; }
  if (isTrMode(state.mode) && !VERBS.some(v => trOf(v))) { current = null; $("sheet").innerHTML = `<p class="empty">${L("noTrans")}</p>`; return; }
  current = pick(state.mode); last = current;
  RENDER[state.mode](current);
}

/* Mode 1: typing */
function renderType(v) {
  $("sheet").innerHTML = header(v, L("promptType")) + `
    <form class="answer-row" id="type-form" autocomplete="off">
      <input id="answer" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="hat ge…" aria-label="Perfekt-Form">
      <button class="btn" type="submit" id="type-btn">${L("check")}</button>
      <button class="btn ghost" type="button" id="skip-btn" hidden>${L("next")}</button>
    </form>
    <div class="feedback" id="fb"></div>
    <div class="hint" id="type-hint">${L("hintType")}</div>`;
  const input = $("answer");
  input.focus();
  // After a wrong answer the input stays editable so the learner can type the correct form; only the first try is scored.
  let missed = false;
  $("skip-btn").addEventListener("click", () => next());
  input.addEventListener("keydown", e => { if (e.key === "Escape" && missed && !locked) { e.preventDefault(); next(); } });
  $("type-form").addEventListener("submit", e => {
    e.preventDefault();
    if (locked) return next();
    const given = norm(input.value);
    if (!given) return;
    const parts = given.split(" ");
    const auxGiven = parts.length > 1 ? parts[0] : null;
    const ppGiven = parts.length > 1 ? parts.slice(1).join(" ") : parts[0];
    const ppOk = ppGiven === norm(v.pp);
    const auxOk = auxGiven === v.aux;
    const fb = $("fb");
    if (!auxGiven && ppOk) {
      fb.className = "feedback bad";
      fb.innerHTML = `<span>${L("needAux", { hat: "<b>hat</b>", ist: "<b>ist</b>" })}</span>`;
      return;
    }
    const correct = ppOk && auxOk;
    if (!missed) record(v, correct);
    if (correct) {
      locked = true; input.readOnly = true; $("type-btn").textContent = L("next", {}, false);
      $("skip-btn").hidden = true;
      fb.className = "feedback ok";
      fb.innerHTML = `<span>${L("right")}</span><span class="sol">${esc(v.full)}</span>`;
      timer = setTimeout(next, 900);
    } else {
      missed = true;
      const why = ppOk ? L("wrongAux", { aux: `<b>${v.aux}</b>` }) : auxOk ? L("wrongPp") : L("shouldBe");
      const sol = `<span class="${auxOk ? "" : "hit"}">${v.aux}</span> <span class="${ppOk ? "" : "hit"}">${esc(v.pp)}</span>`;
      fb.className = "feedback bad";
      fb.innerHTML = `<span>${why}</span><span class="sol">${sol}</span>`;
      $("skip-btn").hidden = false;
      $("type-hint").innerHTML = L("retry");
      input.focus(); input.setSelectionRange(input.value.length, input.value.length);
    }
  });
}

/* Mode 2: hat or ist */
function renderAux(v) {
  $("sheet").innerHTML = header(v, L("promptAux")) + `
    <div class="choices aux-choices">
      <button class="choice" data-a="hat"><span class="k">H</span>hat</button>
      <button class="choice" data-a="ist"><span class="k">I</span>ist</button>
    </div>
    <div class="feedback" id="fb"></div>
    <div class="hint">${L("hintAux")}</div>`;
  document.querySelectorAll("[data-a]").forEach(b => b.addEventListener("click", () => answerAux(b.dataset.a)));
}
function answerAux(a) {
  if (locked) return;
  locked = true;
  const v = current, correct = a === v.aux;
  record(v, correct);
  document.querySelectorAll("[data-a]").forEach(b => {
    b.disabled = true;
    if (b.dataset.a === v.aux) b.classList.add("right");
    else if (b.dataset.a === a) b.classList.add("wrong");
  });
  const fb = $("fb");
  fb.className = "feedback " + (correct ? "ok" : "bad");
  fb.innerHTML = `<span>${L(correct ? "right" : "wrong")}</span><span class="sol">${esc(v.full)}</span>`;
  timer = setTimeout(next, correct ? 800 : 2000);
}

/* Mode 3: multiple choice */
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function renderMc(v) {
  const other = shuffle(VERBS.filter(x => x.pp !== v.pp))[0];
  const wrongAux = (v.aux === "hat" ? "ist " : "hat ") + v.pp;
  const fakes = [...new Set([...v.fakes.map(f => v.aux + " " + f), wrongAux, ...(other ? [other.full] : [])])].filter(f => f !== v.full);
  const options = shuffle([v.full, ...shuffle(fakes).slice(0, 3)]);
  $("sheet").innerHTML = header(v, L("promptMc")) + `
    <div class="choices">${options.map((o, i) =>
      `<button class="choice" data-o="${esc(o)}"><span class="k">${i + 1}</span>${esc(o)}</button>`).join("")}</div>
    <div class="feedback" id="fb"></div>
    <div class="hint">${L("keys", { range: `<kbd>1</kbd>–<kbd>${options.length}</kbd>` })}</div>`;
  document.querySelectorAll("[data-o]").forEach(b => b.addEventListener("click", () => answerMc(b.dataset.o)));
}
function answerMc(o) {
  if (locked) return;
  locked = true;
  const v = current, correct = o === v.full;
  record(v, correct);
  document.querySelectorAll("[data-o]").forEach(b => {
    b.disabled = true;
    if (b.dataset.o === v.full) b.classList.add("right");
    else if (b.dataset.o === o) b.classList.add("wrong");
  });
  const fb = $("fb");
  fb.className = "feedback " + (correct ? "ok" : "bad");
  fb.innerHTML = `<span>${correct ? L("right") : L("wrong") + " " + L("shouldBe")}</span><span class="sol">${esc(v.full)}</span>`;
  timer = setTimeout(next, correct ? 800 : 2200);
}

/* Mode 4: German verb → meaning */
const verbStem = v => v.inf.replace(/^sich /, "");
// Look-alikes make the useful distractors: same prefix (mitbringen / mitnehmen) or same base verb (anmachen / ausmachen).
function looksAlike(a, b) {
  const x = verbStem(a), y = verbStem(b);
  return x.slice(0, 2) === y.slice(0, 2) || x.slice(-5) === y.slice(-5);
}
function renderMean(v) {
  const tr = trOf(v);
  const others = shuffle(VERBS.filter(x => trOf(x) && trOf(x) !== tr));
  const close = others.filter(x => looksAlike(x, v)).slice(0, 2);
  const wrong = [...new Set([...close, ...others].map(trOf))].slice(0, 3);
  const options = shuffle([tr, ...wrong]);
  $("sheet").innerHTML = header({ ...v, trs: null, tr: "" }, L("promptMeaning")) + `
    <div class="choices">${options.map((o, i) =>
      `<button class="choice" data-o="${esc(o)}"><span class="k">${i + 1}</span><span dir="auto">${esc(o)}</span></button>`).join("")}</div>
    <div class="feedback" id="fb"></div>
    <div class="hint">${L("keys", { range: `<kbd>1</kbd>–<kbd>${options.length}</kbd>` })}</div>`;
  document.querySelectorAll("[data-o]").forEach(b => b.addEventListener("click", () => answerMean(b.dataset.o)));
}
function answerMean(o) {
  if (locked) return;
  locked = true;
  const v = current, tr = trOf(v), correct = o === tr;
  record(v, correct);
  document.querySelectorAll("[data-o]").forEach(b => {
    b.disabled = true;
    if (b.dataset.o === tr) b.classList.add("right");
    else if (b.dataset.o === o) b.classList.add("wrong");
  });
  const fb = $("fb");
  fb.className = "feedback " + (correct ? "ok" : "bad");
  fb.innerHTML = `<span>${correct ? L("right") : L("wrong") + " " + L("shouldBe")}</span><span class="sol"><span dir="auto">${esc(tr)}</span> · ${esc(v.full)}</span>`;
  timer = setTimeout(next, correct ? 1200 : 2600);
}

/* Mode 5: meaning → type the German verb. Like mode 1, a wrong answer can be corrected; only the first try is scored. */
function renderTrans(v) {
  const tr = trOf(v);
  $("sheet").innerHTML = `<div><div class="prompt-label">${L("promptTrans")}</div><div class="verb verb-tr fresh" dir="auto">${esc(tr)}</div></div>
    <form class="answer-row" id="trans-form" autocomplete="off">
      <input id="answer" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" aria-label="Infinitiv" dir="ltr">
      <button class="btn" type="submit" id="type-btn">${L("check")}</button>
      <button class="btn ghost" type="button" id="skip-btn" hidden>${L("next")}</button>
    </form>
    <div class="feedback" id="fb"></div>
    <div class="hint" id="type-hint">${L("hintTrans")}</div>`;
  const input = $("answer");
  input.focus();
  // "sich" is optional, and any verb in the list with this same translation counts.
  const plain = s => norm(s).replace(/^sich /, "");
  const accepted = VERBS.filter(x => trOf(x) === tr).map(x => plain(x.inf));
  const solution = `${esc(v.inf)} · ${esc(v.full)}${v.extra ? ` · ${esc(v.extra)}` : ""}`;
  let missed = false;
  $("skip-btn").addEventListener("click", () => next());
  input.addEventListener("keydown", e => { if (e.key === "Escape" && missed && !locked) { e.preventDefault(); next(); } });
  $("trans-form").addEventListener("submit", e => {
    e.preventDefault();
    if (locked) return next();
    const given = plain(input.value);
    if (!given) return;
    const correct = accepted.includes(given);
    if (!missed) record(v, correct);
    const fb = $("fb");
    if (correct) {
      locked = true; input.readOnly = true; $("type-btn").textContent = L("next", {}, false);
      $("skip-btn").hidden = true;
      fb.className = "feedback ok";
      fb.innerHTML = `<span>${L("right")}</span><span class="sol">${solution}</span>`;
      timer = setTimeout(next, 1600);
    } else {
      missed = true;
      fb.className = "feedback bad";
      fb.innerHTML = `<span>${L("shouldBe")}</span><span class="sol">${solution}</span>`;
      $("skip-btn").hidden = false;
      $("type-hint").innerHTML = L("retry");
      input.focus(); input.setSelectionRange(input.value.length, input.value.length);
    }
  });
}

/* Keyboard */
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey || !$("editor").hidden) return;
  if (["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName)) return;
  const k = e.key.toLowerCase();
  if (state.mode === "aux" && (k === "h" || k === "i")) answerAux(k === "h" ? "hat" : "ist");
  else if (state.mode === "mc" && /^[1-4]$/.test(k)) { const b = document.querySelectorAll("[data-o]")[+k - 1]; if (b) answerMc(b.dataset.o); }
  else if (state.mode === "mean" && /^[1-4]$/.test(k)) { const b = document.querySelectorAll("[data-o]")[+k - 1]; if (b) answerMean(b.dataset.o); }
  else if (locked && (k === "enter" || k === " ") && state.mode !== "type" && state.mode !== "trans") { e.preventDefault(); next(); }
});

/* Page chrome */
function renderStats() {
  $("st-ok").textContent = session.ok; $("st-all").textContent = session.all;
  $("st-streak").textContent = session.streak; $("st-best").textContent = state.best;
}
function renderMastery() {
  $("mastery").innerHTML = VERBS.map(v =>
    `<div class="chip" data-lvl="${lvlOf(v)}" title="${esc(v.full)} · ${lvlOf(v)}/${MAX_LVL}"><span>${esc(v.inf)}</span><span class="aux">${v.aux}</span></div>`).join("");
}
function renderList() {
  $("list").innerHTML = VERBS.map(v =>
    `<tr><td>${esc(v.inf)}</td><td class="pp"><span class="${v.aux === "ist" ? "ist" : ""}">${v.aux}</span> ${esc(v.pp)}</td><td dir="auto">${esc(trOf(v))}${v.extra ? ` <span class="extra">(${esc(v.extra)})</span>` : ""}</td></tr>`).join("");
}
function renderReset() {
  $("reset-area").innerHTML = `<button class="reset" id="reset" type="button">${L("reset")}</button>`;
  $("reset").addEventListener("click", () => {
    $("reset-area").innerHTML = `<div class="confirm">${L("resetSure")}
      <button class="btn ghost small" id="reset-yes" type="button">${L("resetYes")}</button>
      <button class="reset" id="reset-no" type="button" style="margin:0">${L("cancel")}</button></div>`;
    $("reset-yes").addEventListener("click", () => { VERBS.forEach(v => { delete state.lvl[listKey(v)]; delete state.lvl["tr:" + listKey(v)]; }); save(); renderMastery(); renderReset(); });
    $("reset-no").addEventListener("click", renderReset);
  });
}
function setMode(m) {
  state.mode = m; save();
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.mode === m));
  renderMastery();
  next();
}
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => setMode(t.dataset.mode)));

$("lang-select").innerHTML = LANGS.map(([code, name]) =>
  `<option value="${code}"${code === state.lang ? " selected" : ""}>${esc(name)}</option>`).join("");

// Put the interface into the chosen language: static labels, then everything drawn from code.
function applyLanguage() {
  const root = document.documentElement;
  root.lang = state.lang;
  root.dir = RTL.includes(state.lang) ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(el => { el.innerHTML = L(el.dataset.i18n); });
  $("tabs").setAttribute("aria-label", L("gameMode", {}, false));
  $("ed-name").placeholder = L("namePh", {}, false);
  $("ed-format").innerHTML = L("format", { fmt: `<code>${esc(L("fmtCode", {}, false))}</code>` });
  setSync(syncKey);
}

$("lang-select").addEventListener("change", e => {
  state.lang = e.target.value; save();
  applyLanguage();
  activeSig = "";            // redraw list names, subtitle, word list and reset link
  const keep = current;
  refreshLists();
  // Redraw the same question in the new language instead of skipping it.
  if (keep && VERBS.includes(keep) && $("editor").hidden && (!isTrMode(state.mode) || trOf(keep))) {
    clearTimeout(timer); locked = false; current = keep; last = keep;
    RENDER[state.mode](keep);
  }
});

if (!Object.keys(RENDER).includes(state.mode)) state.mode = "type";
document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.mode === state.mode));
applyLanguage();
renderStats();
refreshLists();
</script>
